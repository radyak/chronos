services:

  gateway:
    image: traefik:v3.0
    container_name: gateway
    ports:
      - "5000:5000"
    volumes:
      - ./chronos-gateway/traefik.yml:/etc/traefik/traefik.yml
      - ./chronos-gateway/dynamic.yml:/etc/traefik/dynamic.yml
    depends_on:
      - ui
      - data
      - schema

  data:
    image: maven:3.9.6-eclipse-temurin-17-alpine
    container_name: data
    working_dir: /app/chronos-historical-data-service
    command: mvn spring-boot:run -PinContainer -Dmaven.test.skip=true
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    depends_on:
      - data-db
    ports:
      - "8010:8010"
    extra_hosts:
      - "auth.localhost:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: dev-security,test-data,debug
      PORT: 8010
      APP_OAUTH_ISSUER: http://auth.localhost:7020
      APP_GDP_HOST: data-db
      APP_GDB_USERNAME: neo4j
      APP_GDB_PASSWORD: password
      APP_OAUTH_ADMIN_ROLE: chronos_client_admin

  data-db:
    container_name: data-db
    image: neo4j:5.26.14-community-bullseye
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    #    Activate for persistent local testdata:
    #    volumes:
    #      - "./dev/containerdata/chronos-neo4j-data:/data"

  schema:
    image: maven:3.9.6-eclipse-temurin-17-alpine
    container_name: schema
    working_dir: /app/chronos-schema-definition-service
    command: mvn spring-boot:run -PinContainer -Dmaven.test.skip=true
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    depends_on:
      - schema-db
    ports:
      - "8090:8090"
    extra_hosts:
      - "auth.localhost:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: dev-security,test-data,debug
      PORT: 8090
      APP_OAUTH_ISSUER: http://auth.localhost:7020
      APP_DB_HOST: schema-db
      APP_DB_USER: schema-db-user
      APP_DB_PASSWORD: schema-db-password
      APP_OAUTH_ADMIN_ROLE: chronos_client_admin

  schema-db:
    image: postgres:18.1-alpine3.23
    container_name: schema-db
    shm_size: 128mb
    environment:
      POSTGRES_USER: schema-db-user
      POSTGRES_PASSWORD: schema-db-password
      POSTGRES_DB: chronos-schema-definition
    ports:
      - 5432:5432
    #    Activate for persistent local testdata:
    #    volumes:
    #      - ./data:/var/lib/postgresql/data
    #      - ./logs:/var/log/postgresql
    #      - ./certs:/var/lib/postgresql/certs

  wiki:
    image: maven:3.9.6-eclipse-temurin-17-alpine
    container_name: wiki
    working_dir: /app/chronos-wiki-service
    command: mvn spring-boot:run -PinContainer -Dmaven.test.skip=true
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    ports:
      - "8050:8050"
    extra_hosts:
      - "auth.localhost:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: dev-security,debug
      PORT: 8050
      APP_OAUTH_ISSUER: http://auth.localhost:7020
      APP_OAUTH_ADMIN_ROLE: chronos_client_admin

  ui-backend:
    image: maven:3.9.6-eclipse-temurin-17-alpine
    container_name: ui-backend
    working_dir: /app/chronos-ui-service
    command: mvn spring-boot:run -PinContainer
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
      - ./dev/exampledata/img:/app/data/img:ro
    ports:
      - "8040:8040"
    environment:
      SPRING_PROFILES_ACTIVE: debug
      PORT: 8040
      APP_OAUTH_ISSUER: http://auth.localhost:7020

  ui:
    image: node:24.14.0-alpine3.22
    container_name: ui
    working_dir: /app
    command: npm run start:dev -- --host=0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - ./chronos-frontend:/app

  auth:
    image: node:24.14.0-alpine3.22
    container_name: auth
    working_dir: /app
    command: npm start
    ports:
      - "7020:7020"
    environment:
      PORT: 7020
    volumes:
      - ./chronos-dev-auth:/app

  db-admin:
    image: adminer
    ports:
      - 7000:7000
