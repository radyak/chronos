server.port=${PORT:8010}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${app.auth.issuer}/protocol/openid-connect/certs
app.auth.issuer=${APP_OAUTH_ISSUER}
app.auth.client-id=${APP_OAUTH_CLIENT_ID:chronos-admin-ui}
app.auth.principle-attribute=${APP_OAUTH_PRINCIPLE_ATTRIBUTE:preferred_username}
app.auth.admin-role=${APP_OAUTH_ADMIN_ROLE:chronos_client_admin}
spring.neo4j.uri=bolt://${APP_GDP_HOST}
spring.neo4j.authentication.username=${APP_GDB_USERNAME}
spring.neo4j.authentication.password=${APP_GDB_PASSWORD}
app.schema.client.host=${APP_SCHEMASERVICE_HOST:schema}
app.schema.client.port=${APP_SCHEMASERVICE_PORT:8090}
app.schema.client.basepath=${APP_SCHEMASERVICE_BASEPATH:/api/schema}
