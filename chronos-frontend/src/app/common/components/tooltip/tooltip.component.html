<fa-icon [icon]="helpIcon"
         [ngbTooltip]="template"
         [ngClass]="{'active': active}"
         triggers="manual:blur"
         #t1="ngbTooltip"
         (click)="toggle(t1)">
</fa-icon>

@if (inline && active) {
  <div class="text-secondary-emphasis small">
    <ng-container [ngTemplateOutlet]="template"></ng-container>
  </div>
}

<ng-template #template>
  <ng-content></ng-content>
</ng-template>
