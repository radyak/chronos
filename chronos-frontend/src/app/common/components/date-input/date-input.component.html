<div class="form-control">
  <input type="number"
    class="borderless day"
    name="editDate.day"
    min="1"
    max="31"
    [disabled]="disabled()"
    (change)="update()"
    [(ngModel)]="editDate.day">

  <div class="month-wrapper">
    <input type="number"
      class="borderless month"
      name="editDate.month"
      min="1"
      max="12"
      [disabled]="disabled()"
      (change)="update()"
      [(ngModel)]="editDate.month">
    <div class="name">
      {{ monthName(editDate.month) }}
    </div>
  </div>

  @if (editDate.year >= 0) {
    <span class="era">
      AD
    </span>
  }
  <input type="number"
    class="borderless year"
    name="editDate.year"
    max="2999"
    [disabled]="disabled()"
    (change)="update()"
    [(ngModel)]="editDate.year">

  @if (editDate.year < 0) {
    <span class="era">
      BC
    </span>
  }
</div>
