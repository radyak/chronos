<div ngbDropdown>
  <button
    type="button"
    id="icon"
    class="form-control btn btn-outline-secondary"
    ngbDropdownToggle
  >
    @if (entity) {
      @if (entity.icon) {
        <fa-icon [icon]="entity.icon"></fa-icon>
      }
      {{ entity.key }}
    } @else {
      (no target selected)
    }
  </button>
  <div ngbDropdownMenu aria-labelledby="icon">
    <input
      class="search"
      autofocus
      placeholder="Type to filter ..."
      [(ngModel)]="entitySearch"
      [ngModelOptions]="{ standalone: true }"
    />
    <div class="dropdown-options">
      <button ngbDropdownItem (click)="selectEntity(undefined)">
        (none)
      </button>
      @for (target of entities(); track target) {
        <button ngbDropdownItem (click)="selectEntity(target)">
          @if (target.icon) {
            <fa-icon [icon]="target.icon"></fa-icon>
          }
          {{ target.key }}
        </button>
      }
    </div>
  </div>
</div>
