<h1>Administration: Schema</h1>
<!-- <p class="text-secondary-emphasis small">
        Some explanation here ...
    </p> -->

<div class="admin-controls">
  <button class="btn btn-outline-success" (click)="newEntity()">
    <fa-icon [icon]="newIcon"></fa-icon>
    New Schema Entity
  </button>
</div>

@if (schema.isLoading()) {
  <p>Loading...</p>
}

@if (schema.error()) {
  <p>Error loading data</p>
}

@if (schema.value()?.entities?.elements; as entities) {
  <table class="table table-hover">
    <thead>
      <tr>
        <th scope="col">Key</th>
        <th scope="col">Explanation</th>
        <th scope="col"></th>
      </tr>
    </thead>
    <tbody>
      @for (entity of entities; track entity.id) {
        <tr class="pointer">
          <td (click)="editEntity(entity)">
            {{ entity.key }}
          </td>
          <td (click)="editEntity(entity)">
            {{ entity.explanation }}
          </td>
          <td class="actions">
            <button class="btn btn-sm btn-link btn-outline-success"
                    (click)="editEntity(entity)">
              <fa-icon [icon]="editIcon"></fa-icon>
            </button>
            <button class="btn btn-sm btn-link btn-outline-danger"
                    (click)="deleteEntity(entity)">
              <fa-icon [icon]="deleteIcon"></fa-icon>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
