name: Build and publish Docker images

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [ "main", "feature/**" ]
    # Publish semver tags as releases.
    # tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

env:
  REGISTRY: docker.io   #ghcr.io
  IMAGE_NAME: radyak/chronos


jobs:

  ### BUILD: FRONTEND

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Node & NPM set up
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./chronos-frontend/package-lock.json

      - name: Install & build
        run: |
          cd ./chronos-frontend
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./chronos-frontend/dist


  ### BUILD: BACKEND

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Java & Maven set up
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Maven test
        run: mvn -B clean test

      - name: Maven build
        run: mvn -B clean package -DskipTests

      - name: Artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: app-jars
          path: |
            ./chronos-historical-data-service/target/*.jar
            ./chronos-schema-definition-service/target/*.jar
  

  ### BUILD: IMAGES

  containerize:
    needs:
      - backend-build
      - frontend-build  # TODO
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - chronos-frontend
          - chronos-historical-data-service
          - chronos-schema-definition-service
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Backend artifact download
        uses: actions/download-artifact@v4
        with:
          name: app-jars

      - name: Frontend artifact download
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Docker Buildx setup
        uses: docker/setup-buildx-action@v3.0.0

      - name: ${{ env.REGISTRY }} registry login
        if: github.event_name == 'release'
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: radyak #${{ github.actor }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create ref name
        run: |
          SAFE_REF=$(echo "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g')
          echo "SAFE_REF=$SAFE_REF" >> $GITHUB_ENV

      - name: ${{ env.REGISTRY }} docker image build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'release' }}
          tags: |
            radyak/${{ matrix.service }}:latest
            radyak/${{ matrix.service }}:${{ github.sha }}
            radyak/${{ matrix.service }}:${{ env.SAFE_REF }}

