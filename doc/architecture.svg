link Wiki to Auth--><path d="M582.96,345.08 C548.54,378.67 476.9,448.59 448.24,476.56 " fill="none" id="Wiki-&gt;Auth" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="444.33,480.37,453.5715,476.9648,447.9152,476.8848,447.9952,471.2285,444.33,480.37" style="stroke: #A80036; stroke-width: 1.0;"/><!--MD5=[9c0e876dd85f502de2f39fbcb9ccf0f0]
@startuml architecture
  component "Keycloak" as IDP
  interface Auth

  frame Browser {
    component UI
  }

  frame "Cluster" {
    component "UI Server" as UIServer
    component UI
    component "UI Service" as UIS
    component "Gateway" as GW
    component "Schema Definition" as SDS
    component "Historical Data" as HDS
    component "Wiki Service" as Wiki
  }

  UI <.. UIServer

  UI - -> GW
  GW - -> SDS : /api/schema
  GW - -> HDS : /api/data
  GW - -> Wiki : /api/wiki
  GW - -> UIS : /api/ui

  HDS -> SDS : validation

  IDP - Auth
  UI -left-> Auth
  HDS - - -> Auth
  SDS - - -> Auth
  Wiki - - -> Auth


@enduml

