http:
  routers:

    schema:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/schema`)"
      service: schema
      #      middlewares:
      #        - strip-api-prefix
      priority: 100

    wiki:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/wiki`)"
      service: wiki
      priority: 99

    ui-backend:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/ui`)"
      service: ui-backend
      priority: 98

    data:
      entryPoints:
        - web
      rule: "PathPrefix(`/api`)"
      service: data
      #      middlewares:
      #        - strip-api-prefix
      priority: 80

    ui:
      entryPoints:
        - web
      rule: "PathPrefix(`/`)"
      service: ui
      priority: 1

  #  middlewares:
  #    strip-api-prefix:
  #      stripPrefix:
  #        prefixes:
  #          - "/api"

  services:

    schema:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://schema:8090"

    data:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://data:8010"

    ui-backend:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://ui-backend:8040"

    wiki:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://wiki:8050"

    ui:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://ui:4200"
